version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: vidasalud-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d 
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 20s
      timeout: 10s
      retries: 5

  bff-svc:
    image: 944046146394.dkr.ecr.us-east-1.amazonaws.com/ms-vidasalud-bff:latest
    container_name: bff-svc
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_ISSUER_URI: "https://login.microsoftonline.com/43341e84-316b-40a7-a02f-5c94afd3d730/v2.0"
      API_GATEWAY_URL: "https://944046146394.execute-api.us-east-1.amazonaws.com"

  catalog-svc:
    image: 944046146394.dkr.ecr.us-east-1.amazonaws.com/ms-vidasalud-catalog:latest
    container_name: catalog-svc
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/catalog_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root_password

  appointments-svc:
    image: 944046146394.dkr.ecr.us-east-1.amazonaws.com/ms-vidasalud-appointments:latest
    container_name: appointments-svc
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/appointments_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root_password
      RABBITMQ_HOST: 172.31.31.167
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123
      KAFKA_BOOTSTRAP_SERVERS: 172.31.20.205:9092,172.31.20.205:9093,172.31.20.205:9094

  notify-svc:
    image: 944046146394.dkr.ecr.us-east-1.amazonaws.com/ms-vidasalud-notify:latest
    container_name: notify-svc
    restart: on-failure
    environment:
      RABBITMQ_HOST: 172.31.31.167
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin123

  report-svc:
    image: 944046146394.dkr.ecr.us-east-1.amazonaws.com/ms-vidasalud-report:latest
    container_name: report-svc
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/report_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root_password
      KAFKA_BOOTSTRAP_SERVERS: 172.31.20.205:9092,172.31.20.205:9093,172.31.20.205:9094

  audit-svc:
    image: 944046146394.dkr.ecr.us-east-1.amazonaws.com/ms-vidasalud-audit:latest
    container_name: audit-svc
    restart: on-failure
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/audit_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root_password
      KAFKA_BOOTSTRAP_SERVERS: 172.31.20.205:9092,172.31.20.205:9093,172.31.20.205:9094

  admin-rabbit-svc:
    image: 944046146394.dkr.ecr.us-east-1.amazonaws.com/ms-vidasalud-rabbitmq:latest
    container_name: ms-admin-mq
    restart: on-failure
    environment:
      - RABBITMQ_HOST=172.31.31.167 
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123

  admin-kafka-svc:
    image: 944046146394.dkr.ecr.us-east-1.amazonaws.com/ms-vidasalud-kafka:latest
    container_name: ms-admin-kafka
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${EC2_KAFKA_IP}:9092,${EC2_KAFKA_IP}:9093,${EC2_KAFKA_IP}:9094
      KAFKA_DEFAULT_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICAS: 3

volumes:
  mysql_data: