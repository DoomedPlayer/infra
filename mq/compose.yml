services:
  rabbitmq-node-1:
    image: rabbitmq:3-management
    container_name: rabbitmq-node-1
    hostname: rabbitmq-node-1
    ports:
      - "5672:5672"   
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data:
